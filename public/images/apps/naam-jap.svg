<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c9c70"/>
      <stop offset="100%" stop-color="#056346"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54A"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Outer Chanting Mala Beads Loop -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="url(#gold)" stroke-width="12" stroke-dasharray="16 16" filter="url(#shadow)"/>
  <circle cx="256" cy="100" r="16" fill="url(#gold)"/>
  <circle cx="355" cy="141" r="16" fill="url(#gold)"/>
  <circle cx="396" cy="240" r="16" fill="url(#gold)"/>
  <circle cx="355" cy="339" r="16" fill="url(#gold)"/>
  <circle cx="256" cy="380" r="22" fill="url(#gold)"/>
  <circle cx="157" cy="339" r="16" fill="url(#gold)"/>
  <circle cx="116" cy="240" r="16" fill="url(#gold)"/>
  <circle cx="157" cy="141" r="16" fill="url(#gold)"/>

  <!-- Tassel / Counter Indicator -->
  <path d="M256 402 L240 470 L272 470 Z" fill="url(#gold)"/>
  
  <!-- Counter Display inside -->
  <rect x="176" y="200" width="160" height="80" rx="20" fill="#ffffff" opacity="0.95"/>
  <text x="256" y="258" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="52" fill="#056346">108</text>
</svg>
