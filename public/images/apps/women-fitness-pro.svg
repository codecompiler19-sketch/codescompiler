<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4388db"/>
      <stop offset="100%" stop-color="#2455a5"/>
    </linearGradient>
    <filter id="sh2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgBlue)"/>
  
  <!-- Dumbbell & Heart Pulse Graphic -->
  <g filter="url(#sh2)">
    <!-- Dumbbell Bar -->
    <rect x="140" y="240" width="232" height="32" rx="16" fill="#FFFFFF"/>
    <!-- Weights -->
    <rect x="140" y="180" width="40" height="152" rx="20" fill="#7ADFC0"/>
    <rect x="90" y="200" width="36" height="112" rx="18" fill="#FFFFFF"/>
    <rect x="332" y="180" width="40" height="152" rx="20" fill="#7ADFC0"/>
    <rect x="386" y="200" width="36" height="112" rx="18" fill="#FFFFFF"/>
    <!-- Heart Pulse -->
    <path d="M256 120 C220 80 160 120 190 170 L256 240 L322 170 C352 120 292 80 256 120 Z" fill="#FF7A8A"/>
  </g>
</svg>
