<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef9c37"/>
      <stop offset="100%" stop-color="#c96316"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgOrange)"/>
  
  <!-- Devotional Book / Flag Graphic -->
  <g filter="url(#sh)">
    <!-- Flag / Book base -->
    <path d="M140 120 L370 120 L330 200 L370 280 L140 280 Z" fill="#FFFFFF"/>
    <!-- Flag Pole -->
    <rect x="110" y="90" width="30" height="340" rx="12" fill="#FFD54A" stroke="#C96316" stroke-width="4"/>
    <circle cx="125" cy="80" r="22" fill="#FFD54A"/>
    <!-- Om / Gada Symbol -->
    <circle cx="250" cy="200" r="45" fill="#EF9C37"/>
    <text x="250" y="222" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="60" fill="#FFFFFF">🕉</text>
  </g>
</svg>
